[package]
name = "sodals_industrial"
version = "0.1.0"
edition = "2021"

[dependencies]
# --- Deterministik RT İletişim ---
# opcua crate Windows'ta openssl gerektirdiği için opsiyoneldir.
# Production Linux'ta: cargo build --features opcua
opcua = { version = "0.12", features = ["client", "server"], optional = true }
# ZeroMQ de opsiyonel; varsayılan IPC tokio kanallarıdır.
zmq = { version = "0.10", optional = true }

# --- Serileştirme (Sıfır alloc hedefi ile) ---
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }

# --- Zamanlama ve RT ---
tokio = { version = "1.36", features = ["rt", "time", "macros", "sync"] }
libc = "0.2"

# --- Hata Yönetimi ---
thiserror = "1.0"

# --- Loglama (RT dostu, async-aware) ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# --- Paylaşılan Tipler ---
sodals_common = { path = "../sodals_common" }

# --- Python Köprüsü (Sentinel) ---
pyo3 = { version = "0.23.3", features = ["extension-module", "abi3-py38"], optional = true }

[features]
default = []
opcua = ["dep:opcua"]
zmq = ["dep:zmq"]
python = ["pyo3"]

[dev-dependencies]
criterion = "0.5"
proptest = "1.5"
mockall = "0.13"
tempfile = "3"
crossbeam = "0.8"
rand = { version = "0.8", features = ["std_rng"] }

[[bench]]
name = "bench_ring_buffer"
harness = false

[[bench]]
name = "bench_sentinel"
harness = false

[[bench]]
name = "bench_qmem_serde"
harness = false

[[bin]]
name = "sodals_rt_opcua"
path = "src/bin/sodals_rt_opcua.rs"
required-features = ["opcua"]

[[bin]]
name = "sodals_ai_orchestrator"
path = "src/bin/sodals_ai_orchestrator.rs"

[[bin]]
name = "sodals_failsafe_trigger"
path = "src/bin/sodals_failsafe_trigger.rs"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
