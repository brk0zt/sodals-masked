[package]
name = "sodals_neuro"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Candle Ecosystem (Modernize Edildi - 0.8.2 ile uyumlu; CUDA feature-gated for CPU/CI builds)
candle-core = { version = "0.8.2" }
candle-nn = { version = "0.8.2" }
candle-transformers = { version = "0.8.2" }
tokenizers = "0.21.0" # Updated to support modern HuggingFace JSON schemas (Qwen BPE fields)
safetensors = "0.4"

cudarc = { version = "0.10", features = ["cublas"], optional = true }

# Diğer Kütüphaneler
# previously imported configuration & logging from sodals_net,
# now moved into the shared `sodals_common` crate to break a cyclic
# dependency between `sodals_net` and `sodals_neuro`.
sodals_common = { path = "../sodals_common" }

# Matematik & Fizik
rand = "0.8.5"
rand_distr = "0.4"
half = { version = "2.3.1", features = ["rand_distr", "num-traits", "serde"] }
ndarray = "0.15"
lapack = "0.19"
rayon = "1.10"
num-complex = { version = "0.4", features = ["serde"] } 
rustfft = "6.2"
faer = { version = "0.19.0" }
# Sparse Matrix Engine (NEW: CSR Format Performance)
sprs = "0.11"
pest = "2.7"
pest_derive = "2.7"
once_cell = "1.19"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"
regex = "1"
base64 = "0.22"

# Workspace Sensory Organs
ignore = "0.4"
image = "0.25"

# TUI (Nuclear Reactor Control Panel)
ratatui = "0.29"
crossterm = "0.28"

# Sistem
tokio = { version = "1.36", features = ["full"] }
chrono = "0.4"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.5"
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
tracing = "0.1"
sha2 = "0.10"
async-stream = "0.3"
futures = "0.3"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
byteorder = "1.5.0"

# Kardeş Paketler
sodals_crypto = { path = "../sodals_crypto" }
pyo3 = { version = "0.23.3", features = ["extension-module", "abi3-py38"], optional = true }

[features]
default = ["cuda", "python"]
experimental = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
python = ["dep:pyo3"]
brainflow = []  # Enable BrainFlow hardware integration
jemalloc = []

[build-dependencies]
anyhow = "1.0" # build.rs için gerekli olabilir
cc = "1.0"

[dev-dependencies]
sodals_kernel = { path = "../sodals_kernel" }
[[bin]]
name = "qyptos_compiler"
path = "src/bin/qyptos_compiler.rs"

[[bin]]
name = "dump_qk_norm"
path = "src/bin/dump_qk_norm.rs"

[[bin]]
name = "dump_trace"
path = "src/bin/dump_trace.rs"

[[bin]]
name = "dump_logits"
path = "src/bin/dump_logits.rs"
